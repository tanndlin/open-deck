[package]
name = "open-deck"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
enigo = "0.6.1"
hidapi = "2.6.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
imageproc = { version = "0.27", default-features = false, features = ["text"] }
mime_guess = "2.0.5"
rust-embed = "8.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "net", "fs"] }
ureq = "3.3.0"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows-icons = "0.4.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = true
lto = true
codegen-units = 1

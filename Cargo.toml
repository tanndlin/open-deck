[package]
name = "open-deck"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
enigo = "0.6.1"
hidapi = "2.6.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
imageproc = { version = "0.27", default-features = false, features = ["text"] }
mime_guess = "2.0.5"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "net", "fs"] }
ureq = "3.3.0"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows-icons = "0.4.0"

[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[profile.release]
strip = true
lto = true
codegen-units = 1
